[package]
name = "open-tmux-tabs"
version = "1.0.0"
edition = "2021"
description = "Open-TmuxTabs: tmux sessions on remote Linux hosts as Windows Terminal tabs (native Windows GUI)"
license = "Apache-2.0"
authors = ["Jörn Schlingensiepen"]
repository = "https://github.com/schlingensiepen/tmux-helper-rs"
build = "build.rs"
publish = false

[[bin]]
name = "OpenTmuxTabs"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
